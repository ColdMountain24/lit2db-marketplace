[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lit2db"
# Tracks the plugin manifests. `.claude-plugin/plugin.json` is the version of record — it is what
# `/plugin install` and `selfcheck.py` read, and a test pins it against `marketplace.json`. This
# file is pinned to nothing, which is how it sat at 0.5.0 through forty-three releases: a third
# version number that no check compares to anything is not a version, it is a decoration.
version = "0.52.0"
description = "Domain-agnostic literature/structured-data -> ML-ready database pipeline (reference scaffold + MCP spine)."
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "mcp>=1.0", "certifi>=2023"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]   # pyyaml: test-only, reads the instantiation template

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
lit2db-demo = "scripts.run_demo:main"
