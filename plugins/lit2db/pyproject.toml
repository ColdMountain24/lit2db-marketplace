[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lit2db"
version = "0.1.0"
description = "Domain-agnostic literature/structured-data -> ML-ready database pipeline (reference scaffold + MCP spine)."
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "mcp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
lit2db-demo = "scripts.run_demo:main"
