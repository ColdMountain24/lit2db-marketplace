# Domain Instantiation — _TEMPLATE

# This is the ONLY place domain substance lives. Everything here must trace to a ratified
# ratification-ledger item (protocol section 4). The scaffold in ../src is domain-blind.
# Copy this folder to instantiation/<your-project>/ and fill in via the elicitation protocol.
# DO NOT hand-edit fields into the frozen schema — they must come through the ledger.

project_name: "<PLACEHOLDER>"
spec_version: "v0"

# --- Stage 0.5 output (schema-ready spec). Produced by the elicitation interview. --------
research_question: "<researcher's own words — RATIFIED>"
ml_task: "<classification | regression | generative | knowledge_graph>"   # Step A, drives everything
unit_of_analysis: "<one row = one (…) — RATIFIED tuple>"                  # Step B

# fields[] — each MUST carry ledger_item_id of an ACCEPTED / ACCEPTED_WITH_EDIT item below.
# Shape is FieldSpec (src/lit2db/contracts/spec.py). Placeholders only: the substance is yours,
# and it arrives through the interview, never by hand-editing this list.
#   - name: "<schema_field_name>"
#     type: "<float | int | str | bool | enum>"
#     unit: null                   # the unit the value is normalized to, if it is dimensional
#     enum: null                   # [...] iff type is enum — from a vocabulary you RATIFIED
#     valid_range: null            # [lo, hi] iff numeric. Out-of-range is FLAGGED, never dropped
#     definition: "<your own words: what exactly counts as this value>"
#     provenance_granularity: "<what makes two records of this field distinct — Step C axis 10>"
#     ledger_item_id: "F1"         # MUST be ACCEPTED / ACCEPTED_WITH_EDIT in the ledger below
fields: []

# --- Ratification ledger (protocol section 4). The frozen schema IS this list, filtered to the
# ratified items — `SchemaReadySpec` refuses any field tracing to anything else. The agent
# proposes every item; only YOU set `status`. A perfectly reasonable unratified item is still
# not in the schema: that refusal is the whole point.
ledger:
  items: []
#   - item_id: "F1"
#     kind: "<field | axis_setting | vocab_binding | structural_alt | inclusion_criterion | source_scope | threshold_constant>"
#     summary: "<one line: what is being proposed>"
#     proposed_by: agent           # always the agent — it originates structure, never substance
#     status: PROPOSED             # PROPOSED -> ACCEPTED | ACCEPTED_WITH_EDIT | REJECTED (yours alone)
#     edit_note: null              # REQUIRED iff ACCEPTED_WITH_EDIT — what you changed and why
#     reject_reason: null          # logged so the agent does not re-propose it
#     payload: {}                  # the structured content of the item

controlled_vocab_bindings: {}     # existing vocabularies the researcher RATIFIED (Step D)
inclusion_exclusion: {}           # versioned (Step C axis 8)
negative_data_policy: "<RATIFIED — driven by ml_task, Step C axis 7>"
evidence_tier_dimensions: [study_design, directness, consistency, risk_of_bias, effect_direction, certainty]

source_scope:
  adapters: []                    # [literature] | [structured] | both (Step E)
  corpora: []
  structured_databases: []
  field_mapping: {}               # source_field -> schema_field (RATIFIED)
  pinned_versions: {}
  retraction_recheck_cadence: "each_self_improve_cycle"

# --- Stage 2 / calibrated constants (filled AFTER the gold set is annotated) -------------
threshold_constants: {}           # versioned, citable (e.g. a classification cutoff)
confidence_weights:               # override the illustrative DEFAULT_WEIGHTS after calibration
  numeric: {}
  inferential: {}
routing:
  # CONSERVATIVE PLACEHOLDER — you are expected to change this. It is set high so that an
  # uncalibrated project auto-accepts too little (everything queues for review) rather than
  # too much. Calibrate against your gold set: a real calibrated value can land near 0.7,
  # where 0.95 would auto-accept almost nothing. Blueprint 8, gate 2.
  auto_accept_threshold: 0.95
  borderline_margin: null         # width of the borderline-cutoff lane (blueprint 6)
  # Counter-evidence (Stage 4c'). A contradiction found in a value's OWN source always
  # blocks the write — that is not configurable, because every confidence signal scores the
  # span the extractor chose, and a weighted mean would let four confident signals bury one
  # real refutation. What IS configurable is whether an UNSEARCHED value may auto-accept:
  # "we did not look" is not "we looked and it was clean". Leave false to keep existing
  # behaviour; set true for a run where every auto-accept has been audited for cherry-picking
  # (this flag is also the control/treatment switch if you are measuring the difference).
  require_contradiction_search: false
# Budget cap, in TOKENS — not currency. On a flat-rate subscription the marginal cost of a
# run is zero until a limit is hit, so a dollar cap neither protects you nor describes what
# you spent; what runs out is plan capacity, counted in tokens. Expressed as a ratio to your
# gold-set run so it transfers across projects and survives price changes.
token_cap_ratio: 3.0              # x gold-set tokens (blueprint Stage 0)
gold_set_tokens: null             # tokens your gold-set run consumed; null disables the cap

# --- Stage 0 operator config (NOT domain substance) --------------------------------------
# Who is running this and how they reach sources. None of this is ratified schema content —
# it is machine configuration, and it is the only part of this file a colleague fills in
# without an elicitation interview.
operator:
  contact_email: null             # REQUIRED for source access. Unpaywall mandates a contact
                                  # address, and it puts Crossref/NCBI/OpenAlex in their
                                  # polite pools. It is NOT authentication and unlocks
                                  # nothing paywalled — env: LIT2DB_CONTACT_EMAIL
  orcid: null                     # optional; resolves to name + institution via the keyless
                                  # ORCID public API. Used for DATABASE PROVENANCE (who built
                                  # this, for the datasheet) and to tell you which publisher
                                  # TDM programmes your institution may already hold.
                                  # ORCID is an identity registry — it grants no access.
  institution: null               # auto-filled from ORCID employments; override if wrong

# Text-and-data-mining credentials. Per-publisher, per-institution, and entitlement is
# checked against your campus network — a key grants MACHINE access to what you already
# subscribe to, it does not grant subscriptions. NEVER commit real keys: point each entry at
# an environment variable name and keep the value outside the repo.
# Hard rule: use each publisher's designated TDM endpoint, rate-limit, and never replay proxy
# session cookies. Bulk downloading through institutional credentials is the fastest way to
# get an entire university's access revoked.
tdm_keys:
  elsevier: null                  # env var name, e.g. ELSEVIER_TDM_KEY  (dev.elsevier.com)
  wiley: null                     # env var name, e.g. WILEY_TDM_TOKEN
  springer: null                  # env var name, e.g. SPRINGER_TDM_KEY
  # ACS has no comparable public TDM API — those sources route to the manual queue.

# --- Gold set ---------------------------------------------------------------------------
gold_set_path: "../../gold/<project>.jsonl"
gold_set_iaa: null                # Cohen's/Fleiss' kappa per inferential field (blueprint 8, D3)
